name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Laravel 9 – PHP 8.1
          - php: 8.1
            laravel: 9.*
            testbench: ^7.0

          # Laravel 10 – PHP 8.2
          - php: 8.2
            laravel: 10.*
            testbench: ^8.0

          # Laravel 11 – PHP 8.3
          - php: 8.3
            laravel: 11.*
            testbench: ^9.0

          # Laravel 12 – PHP 8.4 (nog geen Testbench release, gebruik voorlopig 10.x-dev)
          - php: 8.4
            laravel: 12.*
            testbench: 10.x-dev

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, sqlite, bcmath, intl
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/support:${{ matrix.laravel }}" \
                          "illuminate/database:${{ matrix.laravel }}" \
                          "orchestra/testbench:${{ matrix.testbench }}" --no-update
          composer update --prefer-dist --no-interaction

      - name: Run tests
        run: vendor/bin/phpunit --testdox --colors=always
